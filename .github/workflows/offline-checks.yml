name: offline-contracts
on: [push, pull_request, workflow_dispatch]
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MLFLOW_DISABLE_AGENT_HINT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements/local.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: ruff check src app tests scripts snowflake
      - run: python -m gridcast run --mode build --fixture --compact --offline --root state/ci --config config/fixture.yaml --splits config/fixture_splits.yaml
      - run: python -m gridcast verify-scenarios --root state/ci --config config/fixture.yaml
      - run: python -m gridcast validate-demo --root state/ci --config config/fixture.yaml
      - run: pytest -q --junitxml=state/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-evidence
          path: |
            state/pytest.xml
            state/ci/docs/evidence
            state/ci/state/test_result.json
            state/ci/state/demo_validation.json
